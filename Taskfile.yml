version: '3'

vars:
  BINARY: stt
  MODULE: github.com/andrejsstepanovs/stt-litellm-cli
  VERSION:
    sh: tr -d ' \t\r\n' < VERSION
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.commit={{.COMMIT}}
    -X main.date={{.DATE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  version:
    desc: Print the current version
    cmds:
      - echo {{.VERSION}}

  build:
    desc: Build the binary for the current platform
    cmds:
      - mkdir -p dist
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/{{.BINARY}} .
    sources:
      - "*.go"
      - VERSION
    generates:
      - dist/{{.BINARY}}

  install:
    desc: Install the binary into GOBIN
    cmds:
      - go install -trimpath -ldflags "{{.LDFLAGS}}" .

  run:
    desc: Run the app
    cmds:
      - go run . {{.CLI_ARGS}}

  chart:
    desc: Print the transcription timing-model chart
    cmds:
      - go run . --chart

  test:
    desc: Run tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format the code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Check formatting
    cmds:
      - test -z "$(gofmt -l .)"

  tidy:
    desc: Tidy the module
    cmds:
      - go mod tidy

  lint:
    desc: Run the linters
    deps: [vet, fmt:check]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist

  build:all:
    desc: Cross-compile the release binaries into dist/
    cmds:
      - mkdir -p dist
      - |
        set -e
        targets="linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64"
        for t in $targets; do
          os=${t%/*}; arch=${t#*/}
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          echo "building $os/$arch"
          GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o "dist/{{.BINARY}}_v{{.VERSION}}_${os}_${arch}${ext}" .
        done

  tray:
    desc: Build the tray quick-action app for the current platform
    cmds:
      - mkdir -p dist
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o dist/{{.BINARY}}-tray{{if eq OS "windows"}}.exe{{end}} ./cmd/stt-tray

  tray:all:
    desc: Cross-compile the tray app for all platforms into dist/
    cmds:
      - mkdir -p dist
      - |
        set -e
        targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
        for t in $targets; do
          os=${t%/*}; arch=${t#*/}
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          echo "building tray $os/$arch"
          # note: darwin requires cgo (build on a Mac); the rest are pure Go
          GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o "dist/{{.BINARY}}-tray_v{{.VERSION}}_${os}_${arch}${ext}" ./cmd/stt-tray || echo "(failed: $os/$arch — see README)"
        done

  tools:
    desc: Install the release tooling
    cmds:
      - go install github.com/goreleaser/goreleaser/v2@latest

  snapshot:
    desc: Build a local release snapshot (no publish)
    cmds:
      - VERSION={{.VERSION}} goreleaser release --snapshot --clean

  release:
    desc: Build release binaries for all platforms into ./release/
    vars:
      TARGETS:
        - GOOS=linux   GOARCH=amd64
        - GOOS=linux   GOARCH=arm64
        - GOOS=darwin  GOARCH=amd64
        - GOOS=darwin  GOARCH=arm64
        - GOOS=windows GOARCH=amd64
        - GOOS=windows GOARCH=arm64
    cmds:
      - mkdir -p release
      - |
        for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64" "windows/arm64"; do
          os="${target%%/*}"
          arch="${target##*/}"
          out="release/{{.BINARY}}_{{.VERSION}}_${os}_${arch}"
          if [ "$os" = "windows" ]; then out="${out}.exe"; fi
          echo "building $out"
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o "$out" .
        done
